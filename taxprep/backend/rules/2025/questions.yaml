year: 2025
# Adaptive interview graph. Residency (citizen, visa, days...) is collected on the Residency step and
# injected server-side as answers: citizen, green_card, is_student, _residency.
# Each node: id, section, text, type (yesno|number|select|text), options?, help?, show_if? (safe expression)
questions:
  - { id: multi_employer, section: employment, text: "Did you have more than one W-2 job in 2025?", type: yesno }
  - { id: has_1042s, section: employment, text: "Did you receive a Form 1042-S (treaty-exempt pay, scholarship or fellowship)?", type: yesno,
      show_if: "answers.get('_residency') in ['nonresident', 'dual_status']",
      help: "Universities and employers issue 1042-S to nonresident aliens for treaty-exempt wages (codes 17-20) and scholarships (code 16)." }
  - { id: has_scholarship, section: education, text: "Did you get a scholarship, fellowship or stipend that was more than your tuition and required fees?", type: yesno }
  - { id: has_tips_overtime, section: employment, text: "Did you receive tips, or overtime pay at 1.5x your regular rate?", type: yesno }
  - { id: has_interest, section: income, text: "Did you earn bank or brokerage interest (1099-INT)?", type: yesno }
  - { id: has_dividends, section: income, text: "Did you receive dividends (1099-DIV or 1042-S code 06)?", type: yesno }
  - { id: has_capital_gains, section: income, text: "Did you sell stocks, crypto, or other investments?", type: yesno }
  - { id: has_self_employment, section: income, text: "Did you have self-employment or gig income (1099-NEC / 1099-K)?", type: yesno,
      help: "F-1 students may only be self-employed during OPT/STEM OPT in their field. Unauthorized work can affect your status." }
  - { id: tuition_paid, section: education, text: "Did you pay tuition or receive Form 1098-T?", type: yesno,
      show_if: "answers.get('_residency') == 'resident' or answers.get('citizen') == 'yes' or answers.get('green_card') == 'yes'" }
  - { id: student_loan, section: deductions, text: "Did you pay interest on a U.S. student loan (1098-E)?", type: yesno }
  - { id: has_charity, section: deductions, text: "Did you donate to U.S. charities?", type: yesno }
  - { id: has_dependents, section: dependents, text: "Do you have dependents with an SSN who live in the U.S.?", type: yesno,
      show_if: "answers.get('_residency') != 'nonresident'" }
  - { id: num_children, section: dependents, text: "How many qualifying children under 17?", type: number,
      show_if: "answers.get('has_dependents') == 'yes'" }
  - { id: num_other_dependents, section: dependents, text: "How many other dependents (17 or older, or relatives you support)?", type: number,
      show_if: "answers.get('has_dependents') == 'yes'" }
  - { id: state_residency, section: state, text: "Did you live in your state for all of 2025?", type: yesno }
  - { id: state_renter, section: state, text: "Did you rent your home in California for at least half the year?", type: yesno }
