services:
  - type: web
    name: taxprep-api
    runtime: docker
    dockerfilePath: ./taxprep/backend/Dockerfile
    dockerContext: ./taxprep/backend
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false          # paste your Neon connection string, OR your local Postgres via ngrok (see LOCAL-DB.md)
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a random secret
      - key: ADMIN_EMAILS
        sync: false          # optional: comma-separated admin emails (registration needs ADMIN_SETUP_CODE)
      - key: ADMIN_SETUP_CODE
        generateValue: true  # copy it from the Render dashboard; enter it once when registering the admin email
      - key: DATA_KEY
        sync: false          # Fernet key for SSN/passport encryption — see DEPLOY.md step 2
      - key: CORS_ORIGINS
        sync: false          # set to your Vercel URL once you have it, e.g. https://taxprep.vercel.app
      - key: DB_SSLMODE
        value: require       # change to "disable" in the dashboard if using a self-hosted/local Postgres
